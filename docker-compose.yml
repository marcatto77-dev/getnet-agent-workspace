services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: getnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-getnet_local}
      POSTGRES_DB: getnet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getnet -d getnet"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
  api:
    image: getnet-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://getnet:${POSTGRES_PASSWORD:-getnet_local}@db:5432/getnet
      RAG_AUTO_INGEST: ${RAG_AUTO_INGEST:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /app/data/raw:size=32m,noexec,nosuid,mode=1777
      - /app/data/reports:size=8m,noexec,nosuid,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1G}
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid
      - /var/run:size=4m,noexec,nosuid
      - /tmp:size=16m,noexec,nosuid
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE", "CHOWN", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
volumes:
  pgdata:
