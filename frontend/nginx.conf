server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; connect-src 'self' ws: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  location /api/ { proxy_pass http://api:8000; proxy_read_timeout 150s; }
  location /ws/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri $uri/ /index.html; }
  # Revalidate the entrypoint so normal sessions do not keep an older JS bundle.
  location = /index.html { expires -1; }
}
